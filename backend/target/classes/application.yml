server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: student-management-system
  
  # Default Database Setup (H2 for zero-config instant run, MySQL ready)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  # For MySQL connection set environment variables or edit here:
  # url: jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  # driver-class-name: com.mysql.cj.jdbc.Driver
  # username: root
  # password: rootpassword

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
    # For MySQL: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom Security & App Properties
app:
  jwtSecret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  jwtExpirationMs: 86400000 # 24 hours
  upload:
    dir: ./uploads/photos/

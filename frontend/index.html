<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System | Login Portal</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.15), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.15), transparent 40%),
                  var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 40px;
    }
    .nav-tabs .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 12px 20px;
    }
    .nav-tabs .nav-link.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="glass-panel auth-card animate-fade-in">
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem;">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h2 class="fw-bold mb-1">CampusPortal</h2>
      <p class="text-muted small">Student Management System</p>
    </div>

    <!-- Login Role Selection Tabs -->
    <ul class="nav nav-tabs nav-justified mb-4" id="loginTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-login-pane" type="button"><i class="bi bi-person-fill me-2"></i>Student</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-login-pane" type="button"><i class="bi bi-shield-lock-fill me-2"></i>Admin</button>
      </li>
    </ul>

    <div class="tab-content" id="loginTabsContent">
      <!-- Student Login Form -->
      <div class="tab-pane fade show active" id="student-login-pane" role="tabpanel">
        <form onsubmit="handleLogin(event, 'student')">
          <div class="mb-3">
            <label class="form-label fw-semibold text-muted">USN / Roll Number</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-card-heading text-muted"></i></span>
              <input type="text" id="student-username" class="form-control form-control-custom border-start-0" placeholder="e.g. 1CS21001" required value="1CS21001">
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold text-muted mb-0">Password</label>
              <a href="#" class="small text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
              <input type="password" id="student-password" class="form-control form-control-custom border-start-0" placeholder="••••••••" required value="student123">
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 mt-2 py-2 fs-6">Sign In as Student <i class="bi bi-arrow-right-short fs-5 ms-1"></i></button>
        </form>
      </div>

      <!-- Admin Login Form -->
      <div class="tab-pane fade" id="admin-login-pane" role="tabpanel">
        <form onsubmit="handleLogin(event, 'admin')">
          <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Admin Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
              <input type="text" id="admin-username" class="form-control form-control-custom border-start-0" placeholder="admin" required value="admin">
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold text-muted mb-0">Password</label>
              <a href="#" class="small text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
              <input type="password" id="admin-password" class="form-control form-control-custom border-start-0" placeholder="••••••••" required value="admin123">
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 mt-2 py-2 fs-6">Sign In as Admin <i class="bi bi-shield-check fs-5 ms-1"></i></button>
        </form>
      </div>
    </div>

    <!-- Quick Credentials Hint for Testing -->
    <div class="mt-4 p-3 border rounded-3 bg-body-tertiary small">
      <div class="fw-bold mb-1 text-primary"><i class="bi bi-info-circle me-1"></i> Demo Credentials:</div>
      <div><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></div>
      <div><strong>Student:</strong> <code>1CS21001</code> / <code>student123</code></div>
    </div>

    <!-- Theme Toggle Footer -->
    <div class="text-center mt-4">
      <button class="theme-toggle-btn mx-auto" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-key-fill me-2 text-primary"></i>Forgot Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="handleForgotPassword(event)">
          <div class="modal-body">
            <p class="text-muted small">Enter your registered email address below. We will generate a temporary login password for your account.</p>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" id="forgot-email" class="form-control form-control-custom" placeholder="name@university.edu" required>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
